name: Compilador Typst Cloud

on:
  push:
    paths:
      - '**.typ'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: typst-compilation
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Typst
        uses: typst-community/setup-typst@v3

      - name: Compilar archivos Typst a PDF
        run: |
          for file in *.typ; do
            if [ -f "$file" ]; then
              filename="${file%.*}"
              echo "Compilando $file..."
              typst compile "$file" "${filename}.pdf"
            fi
          done

      - name: Guardar PDF en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.pdf
          git commit -m "Auto-compilacion PDF [skip ci]" || echo "No hay cambios de PDF para guardar"
          git pull --rebase --autostash origin main
          git push origin main
